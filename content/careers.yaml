      - "MBA in Marketing or Business Administration"
      - "Experience in B2B sales"
      - "Knowledge of digital marketing concepts"
      - "Familiarity with SaaS or IT services industry"
      - "Strong networking abilities"

      key_skills:
      - "Business Development"
      - "Lead Generation"
      - "Client Relationship Management"
      - "Negotiation"
      - "Sales Strategy"
      - "Market Research"
      - "Communication"
      - "CRM Tools"

    - id: "junior-full-stack-developer"
      title: "Junior Full Stack Developer"
      department: "Engineering"
      location: "Hybrid"
      type: "Full-time"
      experience: "0-2 years"
      salary: "To be disclosed"
      posted_date: "2026-01-10"
      description: "Start your career as a Junior Full Stack Developer! We're looking for enthusiastic developers eager to learn and grow with our team."
      
      responsibilities:
        - "Assist in developing web application features under senior guidance"
        - "Learn and implement frontend components using React"
        - "Build simple backend APIs using Node.js and Express"
        - "Write and maintain documentation for code and features"
        - "Participate in code reviews and learn from feedback"
        - "Fix bugs and improve existing codebase"
        - "Collaborate with team members on assigned tasks"
        - "Continuously learn new technologies and best practices"
      
      requirements:
        - "Bachelor's degree in Computer Science or related field (or equivalent experience)"
        - "Basic knowledge of JavaScript, HTML, and CSS"
        - "Familiarity with React or similar frontend frameworks"
        - "Understanding of basic programming concepts and data structures"
        - "Eagerness to learn and grow as a developer"
        - "Good communication skills and team player attitude"
        - "Basic understanding of version control (Git)"
        - "Problem-solving mindset and attention to detail"
      
      nice_to_have:
        - "Personal projects or portfolio demonstrating coding skills"
        - "Internship experience in software development"
        - "Knowledge of TypeScript"
        - "Familiarity with Node.js or backend development"
        - "Contributions to open-source projects"
      
      key_skills:
        - "JavaScript"
        - "React"
        - "HTML/CSS"
        - "Git"
        - "Problem Solving"
        - "Communication"
        - "Learning Agility"
        - "Teamwork"

