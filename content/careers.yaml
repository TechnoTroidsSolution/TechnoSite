    - id: "business-executive"
      title: "Business Executive"
      department: "Business Development"
      location: "Hybrid"
      type: "Full-time"
      experience: "0-2 years"
      salary: "To be disclosed"
      posted_date: "2026-02-19"
      description: "Drive business growth by identifying new opportunities, building client relationships, and supporting revenue expansion strategies."

      responsibilities:
      - "Identify and generate new business leads through various channels"
      - "Build and maintain strong relationships with clients and partners"
      - "Conduct market research to identify new business opportunities"
      - "Prepare and deliver sales presentations and proposals"
      - "Negotiate contracts and close deals"
      - "Collaborate with marketing and product teams for strategy alignment"
      - "Maintain CRM records and sales reports"
      - "Achieve monthly and quarterly revenue targets"

